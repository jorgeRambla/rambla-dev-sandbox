name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy cv (jorge.rambla.dev)
        run: |
          aws s3 sync apps/cv/dist/ s3://${{ vars.CV_BUCKET }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.CV_DISTRIBUTION_ID }} --paths "/*"

      - name: Deploy sandbox (sandbox.rambla.dev)
        run: |
          aws s3 sync apps/sandbox/dist/ s3://${{ vars.SANDBOX_BUCKET }} --delete --exclude "projects/*"
          aws cloudfront create-invalidation --distribution-id ${{ vars.SANDBOX_DISTRIBUTION_ID }} --paths "/*"

      - name: Deploy the-great-counter (sandbox.rambla.dev/#/the-great-counter)
        run: |
          aws s3 sync apps/the-great-counter/dist/ s3://${{ vars.SANDBOX_BUCKET }}/projects/the-great-counter/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.SANDBOX_DISTRIBUTION_ID }} --paths "/projects/the-great-counter/*"
